name: Feature proposal
description: Propose a change in behavior or scope
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the list of changes the project does not accept in CONTRIBUTING.md
          required: true
