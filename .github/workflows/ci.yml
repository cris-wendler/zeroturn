name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: format, vet, copy, commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.17"
          cache: false
      # gofmt is checked with the minimum supported Go only, because newer
      # releases reformat doc comments differently.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: writing rules
        run: scripts/lint-copy.sh
      - name: commit messages
        run: scripts/check-commit-messages.sh

  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.17"
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: go test
        run: go test ./...
