name: macos

# A macOS runner is billed at ten times its wall clock on a private
# repository, which made it the largest cost in this project's continuous
# integration by a wide margin. It runs weekly here instead of on every
# change, and can be started by hand before anything is released.
#
# What makes that safe is that the work is done on macOS: the suite runs
# locally on this platform before every push. This job catches what a
# local run would not, which is a change that was never run there.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (macos-latest, Go stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: go test
        run: go test ./...
