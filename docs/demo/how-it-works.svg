<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" role="img" aria-labelledby="title desc">
<title id="title">How ZeroTurn works</title>
<desc id="desc">Two lanes. Session Guard: the coding harness sends events from its status line and hooks to ZeroTurn. ZeroTurn checks your thresholds, counts subagents, and keeps local records, then returns a decision for the next subagent: allow, ask you, or deny. The harness applies the decision before the subagent starts. Direct Lane: you run zeroturn verify or zeroturn ship. ZeroTurn runs only approved commands, scans for credentials, and follows safe Git rules, then acts on your project: tests, lint, build, commit, and push. This runs on your machine without a model turn.</desc>
<style>
.card{fill:#0d1117;stroke:#30363d}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.zt{fill:#161b22;stroke-width:2}
.lane{font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.08em}
.title{font:700 16px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f0f6fc}
.body{font:15px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.mono{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#56d4dd}
.label{font:600 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
.note{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
.pill{font:700 15px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#79c0ff"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56d364"/></marker>
</defs>

<rect class="card" x="0.5" y="0.5" width="819" height="409" rx="12"/>

<!-- Session Guard -->
<text class="lane" x="24" y="34" fill="#79c0ff">SESSION GUARD</text>

<rect class="box" x="24" y="50" width="200" height="120" rx="8"/>
<text class="title" x="40" y="78">Coding harness</text>
<text class="body" x="40" y="104">Claude Code</text>
<text class="body" x="40" y="126">status line and hooks</text>

<rect class="zt" x="310" y="50" width="200" height="120" rx="8" stroke="#79c0ff"/>
<text class="title" x="326" y="78">ZeroTurn</text>
<text class="body" x="326" y="104">checks thresholds</text>
<text class="body" x="326" y="126">counts subagents</text>
<text class="body" x="326" y="148">keeps local records</text>

<rect class="box" x="596" y="50" width="200" height="120" rx="8"/>
<text class="title" x="612" y="76">Next subagent</text>
<rect x="612" y="88" width="168" height="22" rx="11" fill="#56d364" fill-opacity=".16" stroke="#56d364"/>
<text class="pill" x="696" y="104" text-anchor="middle" fill="#56d364">allow</text>
<rect x="612" y="115" width="168" height="22" rx="11" fill="#e3b341" fill-opacity=".16" stroke="#e3b341"/>
<text class="pill" x="696" y="131" text-anchor="middle" fill="#e3b341">ask you</text>
<rect x="612" y="142" width="168" height="22" rx="11" fill="#ff7b72" fill-opacity=".16" stroke="#ff7b72"/>
<text class="pill" x="696" y="158" text-anchor="middle" fill="#ff7b72">deny</text>

<path d="M224 110H306" stroke="#79c0ff" stroke-width="2" marker-end="url(#blue)"/>
<text class="label" x="265" y="100" text-anchor="middle">events</text>
<path d="M510 110H592" stroke="#79c0ff" stroke-width="2" marker-end="url(#blue)"/>
<text class="label" x="551" y="100" text-anchor="middle">decision</text>

<path d="M696 170V190H124V174" fill="none" stroke="#79c0ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blue)"/>
<text class="note" x="410" y="212" text-anchor="middle">The harness applies the decision before the subagent starts.</text>

<!-- Direct Lane -->
<text class="lane" x="24" y="258" fill="#56d364">DIRECT LANE</text>

<rect class="box" x="24" y="274" width="200" height="96" rx="8"/>
<text class="title" x="40" y="302">You</text>
<text class="mono" x="40" y="328">zeroturn verify</text>
<text class="mono" x="40" y="350">zeroturn ship</text>

<rect class="zt" x="310" y="274" width="200" height="96" rx="8" stroke="#56d364"/>
<text class="title" x="326" y="302">ZeroTurn</text>
<text class="body" x="326" y="328">approved commands only</text>
<text class="body" x="326" y="350">credential scan, safe Git</text>

<rect class="box" x="596" y="274" width="200" height="96" rx="8"/>
<text class="title" x="612" y="302">Your project</text>
<text class="body" x="612" y="328">tests, lint, build</text>
<text class="body" x="612" y="350">commit and push</text>

<path d="M224 322H306" stroke="#56d364" stroke-width="2" marker-end="url(#green)"/>
<text class="label" x="265" y="312" text-anchor="middle">direct</text>
<path d="M510 322H592" stroke="#56d364" stroke-width="2" marker-end="url(#green)"/>
<text class="label" x="551" y="312" text-anchor="middle">no shell</text>

<text class="note" x="410" y="394" text-anchor="middle">Runs on your machine, without a model turn.</text>
</svg>
