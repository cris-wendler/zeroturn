<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="title desc">
<title id="title">GPL version 3 in plain words</title>
<desc id="desc">You may run ZeroTurn for any purpose including at work, read and change the source, share copies, and charge for it. In return, if you distribute it or a changed version you must keep the license and the copyright notices, say what you changed, give recipients the source, and release it under the same license. There is no warranty. This is a summary, not the license. The text in the LICENSE file is what governs.</desc>
<style>
