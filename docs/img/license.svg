.head{font:700 17px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.body{font:14.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.foot{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
.tag{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#79c0ff}
</style>
