<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-labelledby="title desc">
<title id="title">The three guard modes</title>
<desc id="desc">Observe, the default: shows the session condition and counts subagents, and never blocks or asks. Confirm: asks for your approval before a new subagent when a threshold has been crossed, and you decide. Strict: denies a new subagent when context reaches the critical threshold, other thresholds still ask, and it must be approved on your machine first.</desc>
<style>
.card{fill:#0d1117;stroke:#30363d}
.pane{fill:#161b22;stroke-width:2}
.name{font:700 19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tag{font:700 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3;letter-spacing:.08em}
.body{font:14.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.foot{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
</style>
<rect class="card" x="0.5" y="0.5" width="819" height="249" rx="12"/>

<rect class="pane" x="24" y="28" width="248" height="160" rx="8" stroke="#56d364"/>
<circle cx="46" cy="56" r="7" fill="#56d364"/>
<text class="name" x="62" y="62" fill="#56d364">observe</text>
<text class="tag" x="62" y="80">THE DEFAULT</text>
<text class="body" x="42" y="110">Shows the session</text>
<text class="body" x="42" y="132">condition and counts</text>
<text class="body" x="42" y="154">subagents.</text>
<text class="body" x="42" y="176" fill="#56d364">Never blocks or asks.</text>

<rect class="pane" x="286" y="28" width="248" height="160" rx="8" stroke="#e3b341"/>
<circle cx="308" cy="56" r="7" fill="#e3b341"/>
<text class="name" x="324" y="62" fill="#e3b341">confirm</text>
<text class="tag" x="324" y="80">ASKS FIRST</text>
<text class="body" x="304" y="110">Asks before a new</text>
<text class="body" x="304" y="132">subagent once a</text>
<text class="body" x="304" y="154">threshold is crossed.</text>
<text class="body" x="304" y="176" fill="#e3b341">You decide each time.</text>

<rect class="pane" x="548" y="28" width="248" height="160" rx="8" stroke="#ff7b72"/>
<circle cx="570" cy="56" r="7" fill="#ff7b72"/>
<text class="name" x="586" y="62" fill="#ff7b72">strict</text>
<text class="tag" x="586" y="80">CAN DENY</text>
<text class="body" x="566" y="110">Denies a new subagent</text>
<text class="body" x="566" y="132">at critical context.</text>
<text class="body" x="566" y="154">Other thresholds ask.</text>
<text class="body" x="566" y="176" fill="#ff7b72">You approve it first.</text>

<text class="foot" x="410" y="220" text-anchor="middle">Thresholds are yours to set: context use, usage windows, session length, and subagent counts.</text>
</svg>
