<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="title desc">
<title id="title">What ZeroTurn records and what it never records</title>
<desc id="desc">Recorded: session identifier, harness name and version, context percentage and window size, five hour and seven day usage with reset times, session duration, subagent starts, stops and active count, background task count, gate decisions and direct command counts, and a hash that identifies the repository without its path. Never recorded: prompts and responses, source code and diffs, subagent instructions, transcript contents, credentials, environment variables, repository paths, and remote URLs containing credentials. Everything stays on your machine, records older than seven days are removed, and zeroturn report purge removes them all.</desc>
<style>
.card{fill:#0d1117;stroke:#30363d}
.pane{fill:#161b22;stroke-width:2}
.head{font:700 17px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.body{font:14.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.foot{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
.mono{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#56d4dd}
</style>
<rect class="card" x="0.5" y="0.5" width="819" height="329" rx="12"/>

<rect class="pane" x="24" y="24" width="376" height="236" rx="8" stroke="#56d364"/>
<path d="M44 44l6 7 12 -14" fill="none" stroke="#56d364" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="head" x="72" y="50" fill="#56d364">Recorded, on your machine</text>
<text class="body" x="44" y="84">session identifier, harness and version</text>
<text class="body" x="44" y="110">context percent and window size</text>
<text class="body" x="44" y="136">five hour and seven day usage</text>
<text class="body" x="44" y="162">session duration</text>
<text class="body" x="44" y="188">subagent starts, stops, active count</text>
<text class="body" x="44" y="214">gate decisions and command counts</text>
<text class="body" x="44" y="240">a hash of the repository, not its path</text>

<rect class="pane" x="420" y="24" width="376" height="236" rx="8" stroke="#ff7b72"/>
<path d="M440 38l14 14M454 38l-14 14" fill="none" stroke="#ff7b72" stroke-width="3" stroke-linecap="round"/>
<text class="head" x="468" y="50" fill="#ff7b72">Never recorded</text>
<text class="body" x="440" y="84">prompts and responses</text>
<text class="body" x="440" y="110">source code and diffs</text>
<text class="body" x="440" y="136">subagent instructions</text>
<text class="body" x="440" y="162">transcript contents</text>
<text class="body" x="440" y="188">credentials and environment values</text>
<text class="body" x="440" y="214">repository paths</text>
<text class="body" x="440" y="240">remote URLs holding credentials</text>

<text class="foot" x="24" y="292">No network requests, no model calls, no background process. Records older than seven days are removed.</text>
<text class="mono" x="24" y="316">zeroturn report purge --all</text>
<text class="foot" x="262" y="316">removes every ZeroTurn record and nothing else.</text>
</svg>
