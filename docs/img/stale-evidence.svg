<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-labelledby="title desc">
<title id="title">How validation evidence goes stale</title>
<desc id="desc">Three steps. First, zeroturn verify passes and records evidence for repository state cab46d1b8898. Second, the code changes, for example an agent edits a file, and the repository state becomes 7e02b91f4a3d. Third, zeroturn report current says the validation is stale, because the checks passed for code that is no longer there.</desc>
<style>
.card{fill:#0d1117;stroke:#30363d}
.pane{fill:#161b22;stroke-width:2}
.step{font:700 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3;letter-spacing:.08em}
.cmd{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
.big{font:700 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.body{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.mono{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9da7b3}
.foot{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
.arrow{stroke:#6e7681;stroke-width:2;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="819" height="269" rx="12"/>

<rect class="pane" x="24" y="28" width="232" height="170" rx="8" stroke="#56d364"/>
<text class="step" x="42" y="56">1. YOU VALIDATE</text>
<text class="cmd" x="42" y="84">zeroturn verify</text>
<text class="big" x="42" y="122" fill="#56d364">PASS</text>
<text class="body" x="42" y="152">Evidence recorded for</text>
<text class="mono" x="42" y="174">state cab46d1b8898</text>

<path class="arrow" d="M262 113 h26" marker-end="url(#a)"/>

<rect class="pane" x="294" y="28" width="232" height="170" rx="8" stroke="#30363d"/>
<text class="step" x="312" y="56">2. THE CODE MOVES</text>
<text class="cmd" x="312" y="84">an agent edits a file</text>
<text class="big" x="312" y="122" fill="#c9d1d9">CHANGED</text>
<text class="body" x="312" y="152">The repository is now</text>
<text class="mono" x="312" y="174">state 7e02b91f4a3d</text>

<path class="arrow" d="M532 113 h26" marker-end="url(#a)"/>

<rect class="pane" x="564" y="28" width="232" height="170" rx="8" stroke="#e3b341"/>
<text class="step" x="582" y="56">3. YOU ASK</text>
<text class="cmd" x="582" y="84">zeroturn report current</text>
<text class="big" x="582" y="122" fill="#e3b341">STALE</text>
<text class="body" x="582" y="152">The checks passed for code</text>
<text class="body" x="582" y="174">that is no longer there.</text>

<text class="foot" x="24" y="232">A passing run answers for one state of the code. ZeroTurn writes down which one,</text>
<text class="foot" x="24" y="252">and tells you when the code on disk is a different one.</text>
</svg>
